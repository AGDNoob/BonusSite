<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b12" id="themeColorMeta" />
  <title>CWL Rangliste</title>
  <style>
    /* ===========================================================
       Tokens & Themes
    =========================================================== */
    :root{
      --radius:16px; --radius-sm:12px; --radius-lg:22px; --maxw:1080px;
      --gold:#f5c542; --silver:#cdd8ec; --bronze:#e0975a;
      --up:#2fd16a; --down:#ff5a52; --new:#4f8cff;
      --ease:cubic-bezier(.4,0,.2,1);
    }
    html[data-theme="dark"]{
      --bg:#080b12; --grad1:#16203f; --grad2:#0a0e18;
      --panel:#0f1726; --panel-2:#131c2e;
      --card:rgba(255,255,255,.035); --card-hover:rgba(255,255,255,.07);
      --text:#e9eefc; --muted:#909dba; --muted-2:#6b7794;
      --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.17);
      --accent:#4f8cff; --accent-ink:#fff; --accent-weak:rgba(79,140,255,.15);
      --shadow:0 18px 50px rgba(0,0,0,.45);
      --badge-n:rgba(255,255,255,.05);
    }
    html[data-theme="light"]{
      --bg:#e9edf6; --grad1:#d6e2ff; --grad2:#eef1f8;
      --panel:#ffffff; --panel-2:#f5f8fd;
      --card:rgba(16,28,54,.025); --card-hover:rgba(16,28,54,.055);
      --text:#0d1526; --muted:#5b6886; --muted-2:#7c89a6;
      --line:rgba(13,21,38,.10); --line-strong:rgba(13,21,38,.20);
      --accent:#2563eb; --accent-ink:#fff; --accent-weak:rgba(37,99,235,.12);
      --shadow:0 16px 40px rgba(31,45,80,.16);
      --badge-n:rgba(16,28,54,.05);
    }

    /* ===========================================================
       Base
    =========================================================== */
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Cantarell,"Noto Sans",sans-serif;
      color:var(--text); background:var(--bg);
      background-image:radial-gradient(1200px 720px at 12% -8%, var(--grad1) 0%, transparent 55%),
                       radial-gradient(900px 600px at 110% 0%, var(--accent-weak) 0%, transparent 50%);
      background-attachment:fixed;
      min-height:100vh; line-height:1.5;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .app{max-width:var(--maxw); margin:0 auto; padding:18px 14px 40px; animation:appIn .5s var(--ease)}
    @keyframes appIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    a{color:var(--accent)}
    button{font-family:inherit}

    /* ===========================================================
       Topbar
    =========================================================== */
    .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px}
    .brand{display:flex; align-items:center; gap:12px; min-width:0}
    .logo{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;overflow:hidden;
      background:linear-gradient(150deg,var(--accent),#7db0ff); color:#fff; box-shadow:0 8px 22px var(--accent-weak)}
    .logo svg{width:26px;height:26px}
    .logo img{width:100%;height:100%;object-fit:contain}
    .brand h1{margin:0; font-size:clamp(18px,4.6vw,24px); font-weight:800; letter-spacing:.2px; line-height:1.15}
    .brand .subtitle{margin:2px 0 0; color:var(--muted); font-size:clamp(11px,3vw,13px)}
    .brand .subtitle b{color:var(--text); font-weight:600}
    .topbar-actions{display:flex; gap:8px; flex:none}
    .icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);
      color:var(--text); display:grid; place-items:center; cursor:pointer; transition:.2s var(--ease)}
    .icon-btn:hover{background:var(--card-hover); border-color:var(--line-strong); transform:translateY(-1px)}
    .icon-btn svg{width:20px;height:20px}
    .icon-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

    /* ===========================================================
       Tabs
    =========================================================== */
    .tabs{display:flex; gap:6px; margin-bottom:16px; background:var(--card); padding:5px; border-radius:14px;
      border:1px solid var(--line); width:fit-content; max-width:100%}
    .tab{border:0; background:none; color:var(--muted); font-weight:700; font-size:14px; padding:9px 18px;
      border-radius:10px; cursor:pointer; transition:.18s var(--ease); white-space:nowrap}
    .tab.active{background:var(--accent); color:var(--accent-ink); box-shadow:0 6px 18px var(--accent-weak)}
    .tab:hover:not(.active){color:var(--text)}
    .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

    /* ===========================================================
       Month selector
    =========================================================== */
    .months{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; margin-bottom:14px;
      scrollbar-width:none; -webkit-overflow-scrolling:touch}
    .months::-webkit-scrollbar{display:none}
    .month-pill{flex:none; padding:9px 15px; border-radius:999px; border:1px solid var(--line);
      background:var(--card); color:var(--muted); font-size:14px; font-weight:600; cursor:pointer;
      white-space:nowrap; transition:.18s var(--ease)}
    .month-pill:hover{background:var(--card-hover); color:var(--text)}
    .month-pill.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 6px 18px var(--accent-weak)}
    .month-pill:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

    /* ===========================================================
       Stats
    =========================================================== */
    .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
    .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
      padding:13px 10px; text-align:center; transition:.2s var(--ease)}
    .stat:hover{transform:translateY(-2px); border-color:var(--line-strong)}
    .stat .v{font-size:clamp(17px,4.6vw,22px); font-weight:900; color:var(--text); font-variant-numeric:tabular-nums; line-height:1.1}
    .stat .v small{font-size:.6em; color:var(--muted); font-weight:700}
    .stat .l{font-size:clamp(9px,2.4vw,11px); color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:6px}
    @media(max-width:520px){ .stats{grid-template-columns:repeat(2,1fr)} }

    /* ===========================================================
       Controls
    =========================================================== */
    .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
    .search{position:relative; flex:1 1 240px; min-width:0}
    .search svg.s-ico{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:17px;height:17px; color:var(--muted); pointer-events:none}
    .search input{width:100%; padding:13px 40px 13px 40px; border-radius:var(--radius-sm);
      border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:16px; outline:none; transition:.2s var(--ease)}
    .search input::placeholder{color:var(--muted-2)}
    .search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak)}
    .search .clear{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:28px;height:28px;
      border:0; background:var(--card); border-radius:8px; color:var(--muted); cursor:pointer; display:none; place-items:center}
    .search .clear.show{display:grid}
    .search .clear:hover{color:var(--text); background:var(--card-hover)}
    .chips{display:flex; gap:8px; flex:none}
    .chip{padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--card);
      color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; transition:.18s var(--ease); white-space:nowrap}
    .chip:hover{background:var(--card-hover); color:var(--text)}
    .chip.active{background:var(--accent-weak); border-color:var(--accent); color:var(--text)}
    .chip:focus-visible,.search input:focus-visible{outline:none}

    /* ===========================================================
       Podium
    =========================================================== */
    .podium{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px}
    .pod{position:relative; border:1px solid var(--line); border-radius:var(--radius); padding:16px 14px;
      background:linear-gradient(180deg,var(--card-hover),var(--card)); overflow:hidden; cursor:pointer;
      transition:.2s var(--ease)}
    .pod:hover{transform:translateY(-3px); border-color:var(--line-strong); box-shadow:var(--shadow)}
    .pod:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
    .pod::before{content:""; position:absolute; inset:0 0 auto 0; height:4px}
    .pod.p1{grid-column:1 / -1}
    .pod.p1::before{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .pod.p2::before{background:linear-gradient(90deg,transparent,var(--silver),transparent)}
    .pod.p3::before{background:linear-gradient(90deg,transparent,var(--bronze),transparent)}
    .pod .medal{font-size:24px; line-height:1}
    .pod .prank{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em}
    .pod .pname{font-weight:800; margin:8px 0 2px; overflow-wrap:break-word; line-height:1.2}
    .pod.p1 .pname{font-size:clamp(20px,5.2vw,28px)}
    .pod.p2 .pname,.pod.p3 .pname{font-size:clamp(15px,4vw,18px)}
    .pod .ppts{font-weight:900; font-variant-numeric:tabular-nums; color:var(--text)}
    .pod.p1 .ppts{font-size:clamp(22px,6vw,30px)}
    .pod.p2 .ppts,.pod.p3 .ppts{font-size:clamp(18px,5vw,22px)}
    .pod .pmeta{color:var(--muted); font-size:12px; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .pod.p1{box-shadow:0 14px 40px rgba(245,197,66,.10)}
    .pod .crown{position:absolute; right:14px; top:14px; font-size:26px; opacity:.9}
    @media(min-width:720px){
      .podium{grid-template-columns:1fr 1.18fr 1fr; align-items:end; gap:14px}
      .pod.p1{grid-column:auto; order:2; transform:translateY(-10px)}
      .pod.p1:hover{transform:translateY(-13px)}
      .pod.p2{order:1}
      .pod.p3{order:3}
    }

    /* ===========================================================
       Leaderboard
    =========================================================== */
    .board{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
      overflow:hidden; box-shadow:var(--shadow)}
    .results-info{padding:10px 16px 0; color:var(--muted); font-size:12px}
    .row{display:grid; grid-template-columns:48px minmax(0,1fr) 66px 78px; gap:10px; align-items:center; padding:12px 14px}
    .row.head{position:sticky; top:0; z-index:5; background:var(--panel-2); border-bottom:1px solid var(--line)}
    .row.head .th{background:none; border:0; padding:0; margin:0; color:var(--muted); font:inherit;
      font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; cursor:pointer;
      display:inline-flex; align-items:center; gap:4px; transition:color .15s}
    .row.head .th:hover{color:var(--text)}
    .row.head .th.active{color:var(--accent)}
    .row.head .th.col-pts,.row.head .th.col-att{justify-content:flex-end}
    .th .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent}
    .th.active.asc .caret{border-bottom:5px solid currentColor}
    .th.active.desc .caret{border-top:5px solid currentColor}

    .plist .row{border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s}
    .plist .row:last-child{border-bottom:0}
    .plist .row:hover{background:var(--card)}
    .plist .row:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
    .plist .row.hl{background:var(--accent-weak)}
    .badge{display:inline-flex; align-items:center; justify-content:center; min-width:32px; height:32px;
      border-radius:9px; font-weight:800; font-size:14px; font-variant-numeric:tabular-nums}
    .badge.n{background:var(--badge-n); color:var(--muted); border:1px solid var(--line)}
    .badge.g1{background:linear-gradient(160deg,#ffe07a,var(--gold)); color:#3a2a00}
    .badge.g2{background:linear-gradient(160deg,#eaf0fb,var(--silver)); color:#23304a}
    .badge.g3{background:linear-gradient(160deg,#f0b483,var(--bronze)); color:#3a1c00}
    .name-cell{min-width:0}
    .name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
    .pname{font-weight:650; overflow-wrap:break-word; min-width:0}
    .th-mini{font-size:10px; font-weight:800; color:var(--muted); background:var(--badge-n);
      border:1px solid var(--line); border-radius:6px; padding:1px 6px; letter-spacing:.02em; white-space:nowrap}
    .move{display:inline-flex; align-items:center; gap:2px; font-size:11px; font-weight:800; font-variant-numeric:tabular-nums;
      padding:2px 6px; border-radius:999px; line-height:1.4}
    .move.up{color:var(--up); background:color-mix(in srgb,var(--up) 16%,transparent)}
    .move.down{color:var(--down); background:color-mix(in srgb,var(--down) 16%,transparent)}
    .move.same{color:var(--muted-2); background:var(--badge-n)}
    .move.new{color:var(--new); background:color-mix(in srgb,var(--new) 18%,transparent)}
    .pts{text-align:right; font-weight:900; font-variant-numeric:tabular-nums; font-size:15px}
    .att{text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap;
      display:inline-flex; gap:5px; align-items:center; justify-content:flex-end}
    .att.full{color:var(--up); font-weight:700}
    .att .chk{width:15px;height:15px}

    .empty{padding:48px 20px; text-align:center; color:var(--muted)}
    .empty svg{width:34px;height:34px; opacity:.5; margin-bottom:8px}
    .note{padding:14px 16px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); line-height:1.6}
    .note button{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline}

    .season-placeholder{position:relative; overflow:hidden; min-height:300px; padding:clamp(28px,7vw,58px);
      display:grid; align-content:center; background:var(--panel); border:1px solid var(--line);
      border-radius:var(--radius-lg); box-shadow:var(--shadow)}
    .season-placeholder::after{content:"07"; position:absolute; right:clamp(18px,6vw,54px); top:50%;
      transform:translateY(-52%); font-size:clamp(120px,26vw,240px); line-height:1; font-weight:900;
      letter-spacing:-.09em; color:var(--accent); opacity:.055; pointer-events:none}
    .placeholder-copy{position:relative; z-index:1; max-width:570px}
    .placeholder-status{display:inline-flex; align-items:center; gap:9px; color:var(--muted); font-size:12px;
      font-weight:750; letter-spacing:.08em; text-transform:uppercase}
    .placeholder-status::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--muted-2);
      box-shadow:0 0 0 5px var(--badge-n)}
    .season-placeholder h2{margin:18px 0 10px; max-width:520px; font-size:clamp(25px,6vw,42px);
      line-height:1.08; letter-spacing:-.035em}
    .season-placeholder p{margin:0; color:var(--muted); font-size:clamp(14px,3.5vw,17px); line-height:1.65}
    .placeholder-foot{margin-top:24px; padding-top:18px; border-top:1px solid var(--line); font-size:12px !important}

    /* Skeleton */
    .sk{height:57px; border-bottom:1px solid var(--line);
      background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);
      background-size:200% 100%; animation:sk 1.3s infinite}
    @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* ===========================================================
       Panels / generic cards (Profil + Analyse)
    =========================================================== */
    .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
      padding:16px; box-shadow:var(--shadow); margin-bottom:16px}
    .panel > h3{margin:0 0 4px; font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px}
    .panel .psub{color:var(--muted); font-size:12px; margin:0 0 12px}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px}
    @media(max-width:680px){ .grid2{grid-template-columns:1fr; gap:0} }

    .back-btn{display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line);
      color:var(--muted); padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:600; font-size:13px; margin-bottom:14px}
    .back-btn:hover{color:var(--text); background:var(--card-hover); border-color:var(--line-strong)}
    .back-btn svg{width:15px;height:15px}

    /* Profil-Header */
    .prof-head{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; margin-bottom:18px}
    .prof-avatar{width:60px;height:60px;border-radius:16px;flex:none;display:grid;place-items:center;
      background:linear-gradient(150deg,var(--accent),#7db0ff); color:#fff; font-weight:900; font-size:24px;
      box-shadow:0 8px 22px var(--accent-weak)}
    .prof-id{min-width:0; flex:1 1 200px}
    .prof-id h1{margin:0; font-size:clamp(22px,5.5vw,30px); font-weight:900; line-height:1.1; overflow-wrap:break-word}
    .prof-id .pid-sub{color:var(--muted); font-size:13px; margin-top:4px}
    .chip-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px}
    .tag-chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px;
      border:1px solid var(--line); background:var(--card); font-size:12px; font-weight:700; color:var(--text)}
    .tag-chip img{width:16px;height:16px;border-radius:3px;object-fit:contain}
    .tag-chip.th{background:var(--accent-weak); border-color:transparent}
    .tag-chip.role{color:var(--muted)}

    /* Metric grid */
    .metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
    @media(max-width:560px){ .metrics{grid-template-columns:repeat(2,1fr)} }
    .metric{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center}
    .metric .v{font-weight:900; font-size:clamp(16px,4.4vw,20px); font-variant-numeric:tabular-nums; line-height:1.1}
    .metric .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:5px}

    /* CSS-Balkenchart (Punkte je Saison etc.) */
    .chart{display:flex; align-items:flex-end; gap:8px; height:140px; padding:8px 2px 0; margin-top:6px; overflow-x:auto}
    .bar-col{flex:1 0 36px; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; min-width:0}
    .bar-val{font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--muted)}
    .bar{width:100%; max-width:38px; border-radius:7px 7px 3px 3px; background:var(--accent-weak); transition:height .4s var(--ease); min-height:3px}
    .bar.cur{background:linear-gradient(180deg,var(--accent),#7db0ff)}
    .bar.empty{background:var(--badge-n)}
    .bar-lab{font-size:11px; color:var(--muted-2); white-space:nowrap}
    .bar-col.cur .bar-lab{color:var(--accent); font-weight:700}

    /* Rang-Verlauf (SVG-Linie) */
    .rank-chart{width:100%; height:auto; overflow:visible; margin-top:8px}
    .rc-line{stroke:var(--accent); stroke-width:2.5; fill:none; stroke-linejoin:round; stroke-linecap:round}
    .rc-dot{fill:var(--accent)}
    .rc-val{fill:var(--muted); font-size:11px; font-weight:800; font-variant-numeric:tabular-nums}
    .rc-lab{fill:var(--muted-2); font-size:10px}

    /* Horizontale Balken */
    .hbars{display:flex; flex-direction:column; gap:9px; margin-top:8px}
    .hbar{display:grid; grid-template-columns:96px 1fr 44px; gap:10px; align-items:center; font-size:12px}
    .hbar .lab{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .hbar .track{height:9px; background:var(--badge-n); border-radius:999px; overflow:hidden}
    .hbar .fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),#7db0ff); min-width:2px; transition:width .4s var(--ease)}
    .hbar .val{text-align:right; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text)}

    /* Sterne-Verteilung */
    .stardist{display:flex; height:16px; border-radius:999px; overflow:hidden; background:var(--badge-n); margin:10px 0 8px}
    .stardist span{display:block; transition:width .4s var(--ease)}
    .sd3{background:#2fd16a}.sd2{background:#7db0ff}.sd1{background:var(--gold)}.sd0{background:var(--down)}
    .sd-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted)}
    .sd-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

    /* All-Time / Roster Ranglisten */
    .rank-list{display:flex; flex-direction:column; margin-top:4px}
    .rank-item{display:grid; grid-template-columns:24px 1fr auto; gap:10px; align-items:center; padding:9px 4px;
      border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s}
    .rank-item:last-child{border-bottom:0}
    .rank-item:hover{background:var(--card)}
    .rank-item .ri-rank{color:var(--muted); font-weight:800; font-variant-numeric:tabular-nums; font-size:13px; text-align:center}
    .rank-item .ri-name{font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:7px}
    .rank-item .ri-val{font-weight:900; font-variant-numeric:tabular-nums; font-size:14px}
    .rank-item .ri-sub{color:var(--muted-2); font-size:11px; font-weight:600}

    /* Season-Tabelle im Profil */
    .seas-tab{margin-top:8px; font-size:13px}
    .seas-tab .st-row{display:grid; grid-template-columns:minmax(0,1.4fr) 44px 60px 56px 52px; gap:8px; align-items:center;
      padding:9px 4px; border-bottom:1px solid var(--line)}
    .seas-tab .st-row.head{color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.07em; font-weight:700}
    .seas-tab .st-row:last-child{border-bottom:0}
    .seas-tab .st-name{font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .seas-tab .num{text-align:right; font-variant-numeric:tabular-nums}
    .seas-tab .muted{color:var(--muted)}

    /* Clan-Banner */
    .clan-banner{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
    .clan-banner img{width:64px;height:64px;flex:none}
    .clan-banner h2{margin:0;font-size:clamp(18px,4.6vw,22px);font-weight:900}
    .clan-banner .cb-sub{color:var(--muted); font-size:13px; margin-top:3px}
    .clan-desc{color:var(--muted); font-size:13px; margin-top:12px; line-height:1.6}

    .note-inline{color:var(--muted-2); font-size:12px; margin-top:10px; line-height:1.5}

    /* ===========================================================
       Modal
    =========================================================== */
    .backdrop{position:fixed; inset:0; background:rgba(4,7,14,.62); backdrop-filter:blur(4px);
      display:flex; align-items:flex-end; justify-content:center; padding:0; z-index:50; opacity:0; animation:fade .2s forwards}
    @media(min-width:640px){ .backdrop{align-items:center; padding:20px} }
    @keyframes fade{to{opacity:1}}
    .modal{background:var(--panel); border:1px solid var(--line-strong); width:100%; max-width:480px;
      border-radius:var(--radius-lg) var(--radius-lg) 0 0; box-shadow:var(--shadow); max-height:90vh; overflow:auto;
      animation:sheet .28s var(--ease); padding-bottom:env(safe-area-inset-bottom)}
    @media(min-width:640px){ .modal{border-radius:var(--radius-lg)} }
    @keyframes sheet{from{transform:translateY(24px); opacity:.4}to{transform:none; opacity:1}}
    .modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 20px 12px;
      position:sticky; top:0; background:var(--panel)}
    .modal-head h2{margin:0; font-size:20px; font-weight:800; word-break:break-word}
    .modal-head .sub{color:var(--muted); font-size:13px; margin-top:3px}
    .modal-body{padding:4px 20px 22px}
    .info-list{margin:0; padding:0; list-style:none}
    .info-list li{padding:11px 0; border-bottom:1px solid var(--line); display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--muted)}
    .info-list li:last-child{border-bottom:0}
    .info-list b{color:var(--text); font-weight:700}
    .info-list .ic{flex:none; width:26px;height:26px;border-radius:8px; background:var(--accent-weak); color:var(--accent);
      display:grid; place-items:center; font-weight:900; font-size:13px}

    .credits{text-align:center; padding:30px 16px 8px; color:var(--muted); font-size:13px}
    .credits strong{color:var(--text); font-weight:600}

    @media(max-width:440px){
      .row{grid-template-columns:38px minmax(0,1fr) 50px 58px; gap:8px; padding:12px 11px}
      .pname{font-size:14px}
      .badge{min-width:30px; height:30px; font-size:13px; border-radius:8px}
      .pts{font-size:14px}
      .att{font-size:12px}
      .row.head .th{font-size:10px}
      .move{font-size:10px; padding:1px 5px}
    }

    @media(prefers-reduced-motion:reduce){
      *{animation-duration:.001s !important; transition-duration:.001s !important}
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <div class="logo" id="brandLogo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 4h14v3a5 5 0 0 1-3 4.58V13a4 4 0 0 1-3 3.87V19h3v2H8v-2h3v-2.13A4 4 0 0 1 8 13v-1.42A5 5 0 0 1 5 7V4Z" fill="currentColor"/><path d="M3 5h2v2a3 3 0 0 1-2-2.83V5Zm16 0h2v.17A3 3 0 0 1 19 7V5Z" fill="currentColor" opacity=".7"/></svg>
        </div>
        <div>
          <h1>CWL Rangliste</h1>
          <p class="subtitle"><b id="seasonLabel">…</b></p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="infoBtn" aria-label="Wertung erklären" title="Wie wird gewertet?">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 11v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Hell/Dunkel umschalten" title="Theme"></button>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs" id="tabs" aria-label="Ansicht">
      <button class="tab" data-nav="#" id="tabBoard">Rangliste</button>
      <button class="tab" data-nav="#a" id="tabAnalyse">Analyse</button>
    </nav>

    <!-- View container (per route gefüllt) -->
    <main id="view"></main>

    <footer class="credits">Seite, Daten &amp; Berechnungen von <strong>AGDNoob</strong> &lt;3</footer>
  </div>

  <script>
  (function(){
    "use strict";

    const state = {
      manifest:null, clan:null,
      rosterByTag:new Map(), rosterByName:new Map(),
      seasons:{}, chrono:[], nameIdx:new Map(),
      view:'board', curSeason:null,
      search:'', filter:'all', sort:{key:'rank', dir:1}
    };

    const $ = s => document.querySelector(s);
    const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const MON_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    function seasonShort(key){
      const m = String(key).match(/(\d{4})-(\d{2})(?:-(\d+))?/);
      if(!m) return key;
      return (MON_SHORT[+m[2]-1]||key) + (m[3] ? '·'+m[3] : '');
    }
    const labelOf = key => (state.seasons[key] && state.seasons[key].label) || seasonShort(key);

    /* ---------- Theme ---------- */
    function setTheme(t){
      document.documentElement.setAttribute('data-theme', t);
      try{ localStorage.setItem('cwl-theme', t); }catch(e){}
      $('#themeColorMeta').setAttribute('content', t==='dark' ? '#080b12' : '#e9edf6');
      $('#themeBtn').innerHTML = t==='dark'
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8Z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    }
    (function initTheme(){
      let t='dark'; try{ t=localStorage.getItem('cwl-theme')||'dark'; }catch(e){}
      setTheme(t);
    })();
    $('#themeBtn').addEventListener('click', ()=> setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
    $('#infoBtn').addEventListener('click', openInfo);

    /* ---------- Laden ---------- */
    function errorState(msg){
      $('#view').innerHTML = `<div class="board"><div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <div>${esc(msg)}</div>
        <div style="font-size:12px;margin-top:6px">Die Seite muss über einen Webserver laufen (nicht per Doppelklick), damit die JSON-Dateien geladen werden.</div>
      </div></div>`;
    }

    async function loadAll(){
      $('#view').innerHTML = '<div class="board">'+Array(6).fill('<div class="sk"></div>').join('')+'</div>';
      let manifest;
      try{
        const r = await fetch('data/manifest.json', {cache:'no-store'});
        if(!r.ok) throw 0;
        manifest = await r.json();
      }catch(e){ errorState('Manifest konnte nicht geladen werden.'); return; }
      state.manifest = manifest;

      // Clan-Snapshot (optional)
      try{
        const rc = await fetch('data/clan.json', {cache:'no-store'});
        if(rc.ok){
          state.clan = await rc.json();
          (state.clan.members||[]).forEach(m=>{
            if(m.tag) state.rosterByTag.set(m.tag, m);
            if(m.name) state.rosterByName.set(m.name, m);
          });
        }
      }catch(e){ /* Snapshot optional */ }

      // Saisons laden
      const seasons = manifest.seasons || [];
      const loaded = await Promise.all(seasons.map(async s=>{
        try{
          const r = await fetch('data/'+(s.file||('seasons/'+s.key+'.json')), {cache:'no-store'});
          if(!r.ok) return null;
          const j = await r.json();
          return {
            key:s.key,
            label:j.month||s.label||seasonShort(s.key),
            players:j.players||[],
            status:j.status||'available',
            message:j.message||''
          };
        }catch(e){ return null; }
      }));
      loaded.forEach(res=>{
        if(!res) return;
        state.seasons[res.key] = res;
        res.players.forEach(p=>{
          if(!state.nameIdx.has(p.name)) state.nameIdx.set(p.name, new Map());
          state.nameIdx.get(p.name).set(res.key, p);
        });
      });
      state.chrono = seasons.map(s=>s.key).filter(k=>state.seasons[k]);

      if(state.chrono.length===0){ errorState('Keine Saison-Daten gefunden.'); return; }
      if(state.clan && state.clan.clan){
        if(state.clan.clan.badge){
          $('#brandLogo').innerHTML = `<img src="${esc(state.clan.clan.badge)}" alt="" onerror="this.style.display='none'">`;
        }
      }
      route();
    }

    /* ---------- Router ---------- */
    function parseHash(){
      const raw = location.hash.replace(/^#/,'');
      if(!raw) return {view:'board'};
      if(raw==='a' || raw==='analyse') return {view:'analyse'};
      if(raw.startsWith('p/')) return {view:'profile', name:decodeURIComponent(raw.slice(2))};
      if(raw.startsWith('s/')) return {view:'board', season:decodeURIComponent(raw.slice(2))};
      const k = decodeURIComponent(raw);
      if(state.seasons[k]) return {view:'board', season:k};
      return {view:'board'};
    }
    function nav(hash){ if(location.hash===hash){ route(); } else { location.hash = hash; } }
    function route(){
      const r = parseHash();
      state.view = r.view;
      window.scrollTo(0,0);
      $('#tabBoard').classList.toggle('active', r.view==='board');
      $('#tabAnalyse').classList.toggle('active', r.view==='analyse');
      if(r.view==='analyse'){ renderAnalyse(); $('#seasonLabel').textContent = (state.clan&&state.clan.clan&&state.clan.clan.name)||'Analyse'; }
      else if(r.view==='profile'){ renderProfile(r.name); }
      else { renderBoard(r.season); }
    }
    window.addEventListener('hashchange', route);

    /* ===========================================================
       View: Rangliste (Board)
    =========================================================== */
    function renderBoard(seasonKey){
      const key = (seasonKey && state.seasons[seasonKey]) ? seasonKey : state.chrono[state.chrono.length-1];
      state.curSeason = key;
      state.search=''; state.filter='all'; state.sort={key:'rank',dir:1};
      $('#seasonLabel').textContent = 'Clan War League • '+labelOf(key);

      const pills = [...state.chrono].reverse()
        .map(k=>`<button class="month-pill ${k===key?'active':''}" data-season="${esc(k)}">${esc(labelOf(k))}</button>`).join('');

      const current = state.seasons[key];
      if(current.status==='unavailable'){
        $('#view').innerHTML = `
          <nav class="months" id="months" aria-label="Saison wählen">${pills}</nav>
          <section class="season-placeholder" aria-labelledby="placeholderTitle">
            <div class="placeholder-copy">
              <div class="placeholder-status">Keine historischen Detaildaten</div>
              <h2 id="placeholderTitle">Für ${esc(labelOf(key))} liegt keine belastbare Rangliste vor.</h2>
              <p>${esc(current.message||'Die offizielle API stellt rückwirkend keine vollständigen Spieler- und Angriffsdaten für diese CWL bereit.')}</p>
              <p class="placeholder-foot">Der Monat bleibt bewusst als Lücke sichtbar. Es werden keine Werte anderer Monate als Daten dieses Monats ausgegeben.</p>
            </div>
          </section>`;
        return;
      }

      $('#view').innerHTML = `
        <nav class="months" id="months" aria-label="Saison wählen">${pills}</nav>
        <section class="stats" id="stats" aria-label="Statistiken"></section>
        <div class="controls">
          <div class="search">
            <svg class="s-ico" viewBox="0 0 20 20" fill="currentColor"><path d="M12.9 14.32a8 8 0 1 1 1.41-1.41l5.35 5.33-1.42 1.42-5.33-5.34zM8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12z"/></svg>
            <input id="search" type="text" placeholder="Spieler suchen…" autocomplete="off" aria-label="Spieler suchen" />
            <button class="clear" id="clearSearch" data-action="clearSearch" aria-label="Suche löschen">✕</button>
          </div>
          <div class="chips" id="filters" role="group" aria-label="Filter">
            <button class="chip active" data-filter="all">Alle</button>
            <button class="chip" data-filter="bonus">7/7</button>
            <button class="chip" data-filter="active">Aktiv</button>
          </div>
        </div>
        <section class="podium" id="podium" aria-label="Top 3"></section>
        <section class="board">
          <div id="resultsInfo" class="results-info" hidden></div>
          <div class="row head">
            <button class="th col-rank active asc" data-sort="rank">#<span class="caret"></span></button>
            <button class="th col-name" data-sort="name">Spieler<span class="caret"></span></button>
            <button class="th col-pts" data-sort="points">Punkte<span class="caret"></span></button>
            <button class="th col-att" data-sort="attacks">Angriffe<span class="caret"></span></button>
          </div>
          <div class="plist" id="list"></div>
          <div class="note">
            Grundpunkte = Sterne (0/5/10/20) + 0,1 × Zerstörung %, gewichtet nach Rathaus: höher ×1,25/Stufe, niedriger ×0,85/Stufe • Bonus +5 bei 7/7 • Jeder Account zählt einzeln.
            <button data-action="info">Mehr&nbsp;dazu</button>
          </div>
        </section>`;
      renderStats(); renderPodium(); renderList(); syncSortHeaders();
    }

    function selectSeason(key){
      if(!state.seasons[key]) return;
      try{ history.replaceState(null,'','#s/'+encodeURIComponent(key)); }catch(e){}
      renderBoard(key);
    }

    function thFor(p){
      if(p && typeof p.th==='number') return p.th;
      const r = state.rosterByName.get(p && p.name);
      return r && r.th ? r.th : null;
    }

    function renderStats(){
      const ps = state.seasons[state.curSeason].players;
      const total = ps.length;
      const active = ps.filter(p=>p.attacks>0);
      const avg = active.length ? Math.round(active.reduce((s,p)=>s+p.points,0)/active.length) : 0;
      const bonus = ps.filter(p=>p.bonus).length;
      const best = ps.reduce((m,p)=>Math.max(m,p.points),0);
      const cards = [
        {v:total, l:'Spieler'},
        {v:avg, l:'Ø Punkte*'},
        {v:`${bonus}<small>/${total}</small>`, l:'7/7 Bonus'},
        {v:best, l:'Bestwert'}
      ];
      $('#stats').innerHTML = cards.map(c=>`<div class="stat"><div class="v">${c.v}</div><div class="l">${c.l}</div></div>`).join('');
    }

    function isDefaultView(){ return !state.search && state.filter==='all' && state.sort.key==='rank' && state.sort.dir===1; }
    function viewPlayers(){
      let arr = state.seasons[state.curSeason].players.slice();
      if(state.search){ const q=state.search.toLowerCase(); arr=arr.filter(p=>p.name.toLowerCase().includes(q)); }
      if(state.filter==='bonus') arr=arr.filter(p=>p.bonus);
      else if(state.filter==='active') arr=arr.filter(p=>p.attacks>0);
      const {key,dir}=state.sort;
      arr.sort((a,b)=>{
        let r;
        if(key==='name') r=a.name.localeCompare(b.name,'de',{sensitivity:'base'});
        else r=a[key]-b[key];
        if(r===0) r=a.rank-b.rank;
        return r*dir;
      });
      return arr;
    }

    function movementFor(name){
      const idx = state.chrono.indexOf(state.curSeason);
      if(idx<=0) return null;
      let prevKey = null;
      for(let i=idx-1;i>=0;i--){
        const candidate = state.seasons[state.chrono[i]];
        if(candidate && candidate.status!=='unavailable'){ prevKey=state.chrono[i]; break; }
      }
      if(!prevKey) return null;
      const m = state.nameIdx.get(name);
      const cur = m && m.get(state.curSeason);
      const prev = m && m.get(prevKey);
      if(!cur) return null;
      if(!prev) return {type:'new'};
      const d = prev.rank - cur.rank;
      if(d>0) return {type:'up', n:d};
      if(d<0) return {type:'down', n:-d};
      return {type:'same'};
    }
    function moveHtml(name){
      const m = movementFor(name);
      if(!m) return '';
      if(m.type==='new')  return '<span class="move new" title="Neu in dieser Saison">NEU</span>';
      if(m.type==='same') return '<span class="move same" title="Unverändert">±0</span>';
      if(m.type==='up')   return `<span class="move up" title="${m.n} Plätze hoch">▲${m.n}</span>`;
      return `<span class="move down" title="${m.n} Plätze runter">▼${m.n}</span>`;
    }

    function podCard(p, cls, medal){
      if(!p) return '';
      const att = p.bonus ? `${p.attacks}/7 ✓` : `${p.attacks}/7`;
      const crown = cls==='p1' ? '<span class="crown" aria-hidden="true">👑</span>' : '';
      return `<div class="pod ${cls}" role="button" tabindex="0" data-name="${esc(p.name)}">
        ${crown}
        <div class="prank">${medal} Platz ${p.rank}</div>
        <div class="pname">${esc(p.name)}</div>
        <div class="ppts">${p.points}<span style="font-size:.5em;color:var(--muted);font-weight:700"> Pkt</span></div>
        <div class="pmeta"><span>${att}</span>${moveHtml(p.name)}</div>
      </div>`;
    }
    function renderPodium(){
      const pod = $('#podium'); if(!pod) return;
      if(!isDefaultView()){ pod.style.display='none'; pod.innerHTML=''; return; }
      pod.style.display='';
      const top = state.seasons[state.curSeason].players.slice().sort((a,b)=>a.rank-b.rank);
      pod.innerHTML = podCard(top[0],'p1','🥇') + podCard(top[1],'p2','🥈') + podCard(top[2],'p3','🥉');
    }

    const CHK = '<svg class="chk" viewBox="0 0 20 20" fill="currentColor"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0l4-4z"/></svg>';
    function rowHtml(p){
      const top3 = p.rank<=3;
      const badge = top3 ? `<span class="badge g${p.rank}">${p.rank}</span>` : `<span class="badge n">${p.rank}</span>`;
      const att = p.bonus ? `<span class="att full">${p.attacks}/7 ${CHK}</span>` : `<span class="att">${p.attacks}/7</span>`;
      const th = thFor(p);
      const thChip = th ? `<span class="th-mini">RH${th}</span>` : '';
      const hl = state.search ? 'hl' : '';
      return `<div class="row ${hl}" role="button" tabindex="0" data-name="${esc(p.name)}">
        <div>${badge}</div>
        <div class="name-cell"><div class="name-row"><span class="pname">${esc(p.name)}</span>${thChip}${moveHtml(p.name)}</div></div>
        <div class="pts">${p.points}</div>
        ${att}
      </div>`;
    }
    function renderList(){
      const list = $('#list'); if(!list) return;
      let arr = viewPlayers();
      const def = isDefaultView();
      const info = $('#resultsInfo');
      if(def){ arr=arr.slice(3); if(info) info.hidden=true; }
      else if(info){ info.hidden=false; info.textContent = `${arr.length} Treffer`; }
      if(arr.length===0){
        list.innerHTML = '<div class="empty"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M12.9 14.32a8 8 0 1 1 1.41-1.41l5.35 5.33-1.42 1.42-5.33-5.34zM8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12z"/></svg><div>Keine Spieler gefunden</div></div>';
        return;
      }
      list.innerHTML = arr.map(rowHtml).join('');
    }
    function syncSortHeaders(){
      document.querySelectorAll('.row.head .th').forEach(th=>{
        const on = th.dataset.sort===state.sort.key;
        th.classList.toggle('active', on);
        th.classList.toggle('asc', on && state.sort.dir===1);
        th.classList.toggle('desc', on && state.sort.dir===-1);
      });
    }

    /* ===========================================================
       View: Spieler-Profil
    =========================================================== */
    function rosterFor(name, recs){
      let tag=null;
      for(const r of recs){ if(r && r.tag){ tag=r.tag; break; } }
      if(tag && state.rosterByTag.has(tag)) return state.rosterByTag.get(tag);
      if(state.rosterByName.has(name)) return state.rosterByName.get(name);
      return null;
    }

    function rankChart(hist){
      const pts = hist.map((h,i)=>({i, k:h.k, rank:h.rec?h.rec.rank:null}));
      const played = pts.filter(p=>p.rank!=null);
      if(played.length<1) return '<div class="psub">Keine Daten.</div>';
      const ranks = played.map(p=>p.rank);
      const minR=Math.min(...ranks), maxR=Math.max(...ranks);
      const n=hist.length;
      const W=Math.max(280, n*58), H=150, padX=26, padTop=26, padBot=26;
      const xOf=i=> padX + (n<=1?(W-2*padX)/2:(i/(n-1))*(W-2*padX));
      const yOf=r=> (maxR===minR) ? (padTop+(H-padTop-padBot)/2) : (padTop + (r-minR)/(maxR-minR)*(H-padTop-padBot));
      let d='';
      played.forEach((p,idx)=>{ d += (idx?' L':'M')+xOf(p.i).toFixed(1)+' '+yOf(p.rank).toFixed(1); });
      const dots = played.map(p=>`<circle cx="${xOf(p.i).toFixed(1)}" cy="${yOf(p.rank).toFixed(1)}" r="4" class="rc-dot"/><text x="${xOf(p.i).toFixed(1)}" y="${(yOf(p.rank)-9).toFixed(1)}" class="rc-val" text-anchor="middle">#${p.rank}</text>`).join('');
      const labs = pts.map(p=>`<text x="${xOf(p.i).toFixed(1)}" y="${H-7}" class="rc-lab" text-anchor="middle">${esc(seasonShort(p.k))}</text>`).join('');
      return `<svg class="rank-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Rang-Verlauf">${played.length>1?`<path d="${d}" class="rc-line"/>`:''}${dots}${labs}</svg>`;
    }

    function pointsBars(hist, curKey){
      const maxP = Math.max(1, ...hist.filter(h=>h.rec).map(h=>h.rec.points));
      return '<div class="chart">'+hist.map(h=>{
        const cur = h.k===curKey;
        if(!h.rec) return `<div class="bar-col"><div class="bar-val">–</div><div class="bar empty" style="height:4px"></div><div class="bar-lab">${esc(seasonShort(h.k))}</div></div>`;
        const hgt = Math.max(4, Math.round(h.rec.points/maxP*100));
        return `<div class="bar-col ${cur?'cur':''}"><div class="bar-val">${h.rec.points}</div><div class="bar ${cur?'cur':''}" style="height:${hgt}%"></div><div class="bar-lab">${esc(seasonShort(h.k))}</div></div>`;
      }).join('')+'</div>';
    }

    function renderProfile(name){
      const idx = state.nameIdx.get(name);
      const hist = state.chrono.map(k=>({k, rec: idx ? (idx.get(k)||null) : null}));
      const played = hist.filter(h=>h.rec);
      const recsArr = played.map(h=>h.rec);
      const member = rosterFor(name, recsArr);

      if(played.length===0 && !member){
        $('#view').innerHTML = `<button class="back-btn" data-action="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg> Zurück</button>
          <div class="panel"><h3>${esc(name)}</h3><p class="psub">Für diesen Spieler liegen keine Daten vor.</p></div>`;
        $('#seasonLabel').textContent = esc(name);
        return;
      }

      const active = played.filter(h=>h.rec.attacks>0);
      const best = played.reduce((m,h)=>h.rec.points>m.pts?{pts:h.rec.points,k:h.k}:m,{pts:-1,k:null});
      const top3 = played.filter(h=>h.rec.rank<=3).length;
      const sevens = played.filter(h=>h.rec.bonus).length;
      const avg = active.length ? Math.round(active.reduce((s,h)=>s+h.rec.points,0)/active.length) : 0;
      const bestRank = played.length ? Math.min(...played.map(h=>h.rec.rank)) : 0;
      const richRecs = played.filter(h=>typeof h.rec.stars==='number');
      const totalStars = richRecs.reduce((s,h)=>s+h.rec.stars,0);
      const relAtt = richRecs.reduce((s,h)=>s+h.rec.attacks,0);
      const relPoss = richRecs.reduce((s,h)=>s+h.rec.attacks+(h.rec.missed||0),0);
      const reliability = relPoss ? Math.round(relAtt/relPoss*100) : null;
      const curRec = idx ? idx.get(state.chrono[state.chrono.length-1]) : null;

      // Header-Chips
      const th = member ? member.th : (richRecs.length?richRecs[richRecs.length-1].rec.th:null);
      const chips = [];
      if(th) chips.push(`<span class="tag-chip th">⌂ RH ${th}</span>`);
      if(member && member.role) chips.push(`<span class="tag-chip role">${esc(member.role)}</span>`);
      if(member && member.league) chips.push(`<span class="tag-chip">${member.leagueIcon?`<img src="${esc(member.leagueIcon)}" alt="" onerror="this.style.display='none'">`:''}${esc(member.league)}</span>`);
      if(!member) chips.push(`<span class="tag-chip role">nicht im aktuellen Clan</span>`);

      const sub = curRec
        ? `Aktuelle Saison: Platz ${curRec.rank} · ${curRec.points} Punkte · ${curRec.attacks}/7${curRec.bonus?' ✓':''}`
        : 'In der aktuellen Saison nicht dabei';

      const metrics = [
        {v:played.length, l:'Saisons'},
        {v:avg||'–', l:'Ø aktiv'},
        {v:best.k?best.pts:'–', l:'Bestwert'+(best.k?' ('+seasonShort(best.k)+')':'')},
        {v:bestRank?'#'+bestRank:'–', l:'Bester Rang'},
        {v:top3, l:'Top 3'},
        {v:sevens, l:'7/7 Bonus'},
        {v:richRecs.length?totalStars:'–', l:'Sterne'},
        {v:reliability!=null?reliability+'%':'–', l:'Zuverlässig.'}
      ];

      // Aktuellste Detail-Saison (rich)
      let detailHtml = '';
      if(richRecs.length){
        const d = richRecs[richRecs.length-1];
        const r = d.rec;
        const sTot = (r.s3+r.s2+r.s1+r.s0)||1;
        const seg = (c,n)=> n? `<span class="${c}" style="width:${(n/sTot*100).toFixed(1)}%" title="${n}"></span>`:'';
        const oppMax = Math.max(1, r.up, r.eq, r.down);
        const hbar = (lab,n)=>`<div class="hbar"><span class="lab">${lab}</span><div class="track"><div class="fill" style="width:${(n/oppMax*100).toFixed(0)}%"></div></div><span class="val">${n}</span></div>`;
        detailHtml = `
          <div class="panel">
            <h3>CWL-Details · ${esc(labelOf(d.k))}</h3>
            <p class="psub">${r.attacks} Angriffe · ${r.stars} Sterne · Ø ${r.destr}% Zerstörung${r.missed?` · ${r.missed} verpasst`:''}</p>
            <div class="sd-legend" style="margin-bottom:2px">Sterne-Verteilung</div>
            <div class="stardist">${seg('sd3',r.s3)}${seg('sd2',r.s2)}${seg('sd1',r.s1)}${seg('sd0',r.s0)}</div>
            <div class="sd-legend">
              <span><i class="sd3"></i>3★ ${r.s3}</span><span><i class="sd2"></i>2★ ${r.s2}</span>
              <span><i class="sd1"></i>1★ ${r.s1}</span><span><i class="sd0"></i>0★ ${r.s0}</span>
            </div>
            <div class="sd-legend" style="margin:14px 0 0">Angriffsziele nach Rathaus</div>
            <div class="hbars">
              ${hbar('Höheres RH', r.up)}
              ${hbar('Gleiches RH', r.eq)}
              ${hbar('Niedriger RH', r.down)}
            </div>
          </div>`;
      }

      // Saison-Tabelle
      const hasStars = richRecs.length>0;
      const tabRows = hist.slice().reverse().map(h=>{
        if(!h.rec) return `<div class="st-row"><div class="st-name muted">${esc(labelOf(h.k))}</div><div class="num muted">–</div><div class="num muted">–</div><div class="num muted">–</div><div class="num muted">–</div></div>`;
        const r=h.rec;
        return `<div class="st-row"><div class="st-name">${esc(labelOf(h.k))}</div><div class="num">#${r.rank}</div><div class="num">${r.points}</div><div class="num">${r.attacks}/7</div><div class="num">${typeof r.stars==='number'?r.stars:'–'}</div></div>`;
      }).join('');

      // Roster-Extras
      let rosterHtml='';
      if(member){
        const ri=[];
        if(member.trophies!=null) ri.push({l:'Trophäen', v:member.trophies});
        if(member.legacyBestTrophies!=null) ri.push({l:'Beste Tr. (Legacy)', v:member.legacyBestTrophies});
        if(member.warStars!=null) ri.push({l:'Kriegssterne', v:member.warStars});
        if(member.donations!=null) ri.push({l:'Spenden', v:member.donations});
        if(member.expLevel!=null) ri.push({l:'Level', v:member.expLevel});
        if(member.clanRank!=null) ri.push({l:'Clan-Rang', v:'#'+member.clanRank});
        if(ri.length) rosterHtml = `<div class="panel"><h3>Aktueller Account-Status</h3><div class="metrics" style="margin-bottom:0">${ri.map(x=>`<div class="metric"><div class="v">${x.v}</div><div class="l">${esc(x.l)}</div></div>`).join('')}</div></div>`;
      }

      const initial = esc((name||'?').trim().charAt(0).toUpperCase()||'?');
      $('#seasonLabel').textContent = esc(name);
      $('#view').innerHTML = `
        <button class="back-btn" data-action="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg> Zurück</button>
        <div class="prof-head">
          <div class="prof-avatar">${initial}</div>
          <div class="prof-id">
            <h1>${esc(name)}</h1>
            <div class="pid-sub">${esc(sub)}</div>
            <div class="chip-row">${chips.join('')}</div>
          </div>
        </div>
        <div class="metrics">${metrics.map(m=>`<div class="metric"><div class="v">${m.v}</div><div class="l">${esc(m.l)}</div></div>`).join('')}</div>
        <div class="panel"><h3>Punkte je Saison</h3>${pointsBars(hist, state.chrono[state.chrono.length-1])}</div>
        <div class="grid2">
          <div class="panel"><h3>Rang-Verlauf</h3><p class="psub">Niedriger ist besser.</p>${rankChart(hist)}</div>
          <div class="panel"><h3>Alle Saisons</h3>
            <div class="seas-tab">
              <div class="st-row head"><div>Saison</div><div class="num">Rang</div><div class="num">Punkte</div><div class="num">Angr.</div><div class="num">Sterne</div></div>
              ${tabRows}
            </div>
            ${hasStars?'':'<p class="note-inline">Sterne-Daten erst ab Saison „Juni 2.0" verfügbar.</p>'}
          </div>
        </div>
        ${detailHtml}
        ${rosterHtml}`;
    }

    /* ===========================================================
       View: Clan-Analyse
    =========================================================== */
    function aggregatePlayers(){
      const map = new Map();
      state.chrono.forEach(k=>{
        state.seasons[k].players.forEach(p=>{
          if(!map.has(p.name)) map.set(p.name, {name:p.name, recs:[], total:0, sevens:0, top3:0, best:0, bestKey:null, activeSum:0, activeCount:0});
          const e=map.get(p.name);
          e.recs.push({k,p});
          e.total+=p.points;
          if(p.bonus) e.sevens++;
          if(p.rank<=3) e.top3++;
          if(p.attacks>0){ e.activeSum+=p.points; e.activeCount++; }
          if(p.points>e.best){ e.best=p.points; e.bestKey=k; }
        });
      });
      const arr=[...map.values()];
      arr.forEach(e=>{ e.played=e.recs.length; e.avg=e.activeCount?Math.round(e.activeSum/e.activeCount):0; });
      return arr;
    }

    function rankListHtml(items, valFmt, subFmt){
      return '<div class="rank-list">'+items.map((it,i)=>`
        <div class="rank-item" role="button" tabindex="0" data-name="${esc(it.name)}">
          <div class="ri-rank">${i+1}</div>
          <div class="ri-name">${esc(it.name)}${subFmt?`<span class="ri-sub">${subFmt(it)}</span>`:''}</div>
          <div class="ri-val">${valFmt(it)}</div>
        </div>`).join('')+'</div>';
    }

    function distBars(pairs){ // [{label, value}]
      const max = Math.max(1, ...pairs.map(p=>p.value));
      return '<div class="chart">'+pairs.map(p=>{
        const hgt=Math.max(4, Math.round(p.value/max*100));
        return `<div class="bar-col"><div class="bar-val">${p.value}</div><div class="bar" style="height:${hgt}%"></div><div class="bar-lab">${esc(p.label)}</div></div>`;
      }).join('')+'</div>';
    }

    function renderAnalyse(){
      const agg = aggregatePlayers();
      const byTotal = agg.slice().sort((a,b)=>b.total-a.total).slice(0,8);
      const bySevens = agg.filter(a=>a.sevens>0).sort((a,b)=>b.sevens-a.sevens||b.total-a.total).slice(0,8);
      const byTop3 = agg.filter(a=>a.top3>0).sort((a,b)=>b.top3-a.top3||b.total-a.total).slice(0,8);
      const byBest = agg.slice().sort((a,b)=>b.best-a.best).slice(0,8);
      const byConsistency = agg.filter(a=>a.activeCount>=3).sort((a,b)=>b.avg-a.avg).slice(0,8);

      // Clan-Header + Snapshot
      const c = state.clan && state.clan.clan;
      const members = (state.clan && state.clan.members) || [];
      let clanHead = '';
      if(c){
        const ths = members.map(m=>m.th).filter(x=>x);
        const avgTh = ths.length ? (ths.reduce((s,x)=>s+x,0)/ths.length).toFixed(1) : '–';
        const sumStars = members.reduce((s,m)=>s+(m.warStars||0),0);
        const sumDon = members.reduce((s,m)=>s+(m.donations||0),0);
        clanHead = `
          <div class="panel">
            <div class="clan-banner">
              ${c.badge?`<img src="${esc(c.badge)}" alt="" onerror="this.style.display='none'">`:''}
              <div>
                <h2>${esc(c.name||'Clan')}</h2>
                <div class="cb-sub">Level ${c.level||'–'} · ${c.members||members.length} Mitglieder · Kriegsliga: ${esc(c.warLeague||'–')}</div>
              </div>
            </div>
            <div class="metrics" style="margin:16px 0 0">
              <div class="metric"><div class="v">${c.members||members.length}</div><div class="l">Mitglieder</div></div>
              <div class="metric"><div class="v">${avgTh}</div><div class="l">Ø Rathaus</div></div>
              <div class="metric"><div class="v">${sumStars.toLocaleString('de')}</div><div class="l">Kriegssterne</div></div>
              <div class="metric"><div class="v">${sumDon.toLocaleString('de')}</div><div class="l">Spenden (Saison)</div></div>
            </div>
            ${c.description?`<div class="clan-desc">${esc(c.description)}</div>`:''}
          </div>`;
      }

      // Rathaus-Verteilung
      let thDist='';
      if(members.length){
        const counts={};
        members.forEach(m=>{ if(m.th){ counts[m.th]=(counts[m.th]||0)+1; } });
        const levels=Object.keys(counts).map(Number).sort((a,b)=>a-b);
        thDist = `<div class="panel"><h3>Rathaus-Verteilung</h3><p class="psub">Aktuelle Clan-Mitglieder</p>${distBars(levels.map(l=>({label:'RH'+l, value:counts[l]})))}</div>`;
      }

      // Teilnahme je Saison
      const part = `<div class="panel"><h3>Teilnehmer je Saison</h3>${distBars(state.chrono.map(k=>({label:seasonShort(k), value:state.seasons[k].players.length})))}</div>`;

      // Roster-Ranglisten
      let rosterBoards='';
      if(members.length){
        const top=(field)=> members.filter(m=>m[field]!=null).slice().sort((a,b)=>b[field]-a[field]).slice(0,8).map(m=>({name:m.name, v:m[field], th:m.th}));
        const don=top('donations'), war=top('warStars'), tro=top('trophies');
        const mk=(items,fmt)=> '<div class="rank-list">'+items.map((m,i)=>`<div class="rank-item" role="button" tabindex="0" data-name="${esc(m.name)}"><div class="ri-rank">${i+1}</div><div class="ri-name">${esc(m.name)}${m.th?`<span class="ri-sub">RH${m.th}</span>`:''}</div><div class="ri-val">${fmt(m.v)}</div></div>`).join('')+'</div>';
        rosterBoards = `
          <div class="grid2">
            <div class="panel"><h3>🎁 Spenden</h3><p class="psub">Aktuelle Saison</p>${mk(don,v=>v.toLocaleString('de'))}</div>
            <div class="panel"><h3>⚔️ Kriegssterne</h3><p class="psub">Gesamt (Account)</p>${mk(war,v=>v.toLocaleString('de'))}</div>
          </div>
          <div class="panel"><h3>🏆 Trophäen</h3><p class="psub">Aktueller Stand</p>${mk(tro,v=>v.toLocaleString('de'))}</div>`;
      }

      $('#view').innerHTML = `
        ${clanHead}
        <div class="grid2">
          <div class="panel"><h3>👑 Gesamtpunkte</h3><p class="psub">Über alle Saisons</p>${rankListHtml(byTotal, it=>it.total, it=>it.played+' Saisons')}</div>
          <div class="panel"><h3>⭐ Meiste 7/7</h3><p class="psub">Volle Angriffszahl</p>${bySevens.length?rankListHtml(bySevens, it=>it.sevens+'×', it=>it.played+' Saisons'):'<p class="psub">—</p>'}</div>
        </div>
        <div class="grid2">
          <div class="panel"><h3>🥇 Meiste Top-3</h3><p class="psub">Podiums-Platzierungen</p>${byTop3.length?rankListHtml(byTop3, it=>it.top3+'×'):'<p class="psub">—</p>'}</div>
          <div class="panel"><h3>🔥 Bester Einzelwert</h3><p class="psub">Höchste Saison-Punktzahl</p>${rankListHtml(byBest, it=>it.best, it=>seasonShort(it.bestKey))}</div>
        </div>
        <div class="panel"><h3>🎯 Konstanz</h3><p class="psub">Ø Punkte (mind. 3 aktive Saisons)</p>${byConsistency.length?rankListHtml(byConsistency, it=>it.avg, it=>it.activeCount+' aktiv'):'<p class="psub">Noch zu wenig Daten.</p>'}</div>
        ${thDist}
        ${part}
        ${rosterBoards}
        <p class="note-inline" style="text-align:center">Clan-Snapshot${state.clan&&state.clan.generated?' vom '+new Date(state.clan.generated).toLocaleDateString('de'):''} · Tippe auf einen Namen für das Profil.</p>`;
    }

    /* ===========================================================
       Info-Modal

        <div class="modal-head">

    let lastFocus = null;
    function openModal(html){
      closeModal();
      const bd = document.createElement('div');
      bd.className='backdrop'; bd.id='backdrop';
      bd.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
      document.body.appendChild(bd);
      document.body.style.overflow='hidden';
      lastFocus = document.activeElement;
      bd.addEventListener('click', e=>{ if(e.target===bd) closeModal(); });
      bd.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
      const f = bd.querySelector('[data-close]'); if(f) f.focus();
    }
    function closeModal(){
      const bd = $('#backdrop');
      if(bd){ bd.remove(); document.body.style.overflow=''; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
    }

    /* ===========================================================
       Delegierte Events auf #view
    =========================================================== */
    const view = $('#view');
    function openName(el){ nav('#p/'+encodeURIComponent(el.dataset.name)); }
    view.addEventListener('click', e=>{
      const a = e.target.closest('[data-action]');
      if(a){
        const act=a.dataset.action;
        if(act==='clearSearch'){ const s=$('#search'); if(s){ state.search=''; s.value=''; $('#clearSearch').classList.remove('show'); s.focus(); renderPodium(); renderList(); } }
        else if(act==='info'){ openInfo(); }
        else if(act==='back'){ if(history.length>1) history.back(); else nav('#'); }
        return;
      }
      const seasonEl = e.target.closest('[data-season]');
      if(seasonEl){ selectSeason(seasonEl.dataset.season); return; }
      const sortEl = e.target.closest('[data-sort]');
      if(sortEl){ const k=sortEl.dataset.sort; if(state.sort.key===k) state.sort.dir*=-1; else state.sort={key:k, dir:(k==='name')?1:-1}; syncSortHeaders(); renderPodium(); renderList(); return; }
      const filterEl = e.target.closest('[data-filter]');
      if(filterEl){ state.filter=filterEl.dataset.filter; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x===filterEl)); renderPodium(); renderList(); return; }
      const navEl = e.target.closest('[data-nav]');
      if(navEl && view.contains(navEl)){ nav(navEl.dataset.nav); return; }
      const nameEl = e.target.closest('[data-name]');
      if(nameEl){ openName(nameEl); return; }
    });
    view.addEventListener('input', e=>{
      if(e.target.id==='search'){ state.search=e.target.value.trim(); $('#clearSearch').classList.toggle('show', !!state.search); renderPodium(); renderList(); }
    });
    view.addEventListener('keydown', e=>{
      if(e.key!=='Enter' && e.key!==' ') return;
      const nameEl = e.target.closest('[data-name]'); if(!nameEl) return;
      e.preventDefault(); openName(nameEl);
    });

    // Tabs (außerhalb #view)
    document.querySelectorAll('#tabs [data-nav]').forEach(b=> b.addEventListener('click', ()=> nav(b.dataset.nav)));

    document.addEventListener('keydown', e=>{
      if(e.key==='Escape'){
        if($('#backdrop')) closeModal();
        else if(state.view==='board' && state.search){ state.search=''; const s=$('#search'); if(s)s.value=''; const c=$('#clearSearch'); if(c)c.classList.remove('show'); renderPodium(); renderList(); }
      }else if(e.key==='/' && document.activeElement!==$('#search')){
        const s=$('#search'); if(s){ e.preventDefault(); s.focus(); }
      }
    });

    loadAll();
  })();
  </script>
</body>
</html>
